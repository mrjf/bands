name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Format package tests
        run: bun test --cwd packages/format

      - name: Editor package tests
        run: bun test --cwd packages/editor

      - name: Runtime unit tests
        run: bun test test/unit/ test/executors/
        working-directory: packages/runtime

  skill-tests-direct:
    name: Skill Tests (Direct)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Lima and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v1.0.5/lima-1.0.5-Linux-x86_64.tar.gz | sudo tar xz -C /usr/local

      - name: Create Lima VM
        run: |
          limactl start --name=bands-executor template://ubuntu-lts --vm-type=qemu --cpus=2 --memory=4 --plain
          limactl shell bands-executor -- uname -a
          # Set up SSH port forwarding for band server (--plain mode doesn't auto-forward)
          SSH_CONFIG=~/.lima/bands-executor/ssh.config
          if [ -f "$SSH_CONFIG" ]; then
            ssh -F "$SSH_CONFIG" -fNL 9000:localhost:9000 lima-bands-executor
            echo "Port 9000 forwarded"
          fi

      - name: Set up band server in VM
        run: |
          # Get the VM home directory path (Lima may append .linux to username)
          VM_HOME=$(limactl shell bands-executor -- bash -c 'echo $HOME')
          echo "VM home: $VM_HOME"
          # Install prerequisites
          limactl shell bands-executor -- sudo apt-get update -qq
          limactl shell bands-executor -- sudo apt-get install -y -qq unzip curl iptables bubblewrap jq
          # Install bun
          limactl shell bands-executor -- bash -c 'curl -fsSL https://bun.sh/install | bash'
          # Create band-runner user
          limactl shell bands-executor -- sudo useradd --system --no-create-home --shell /usr/sbin/nologin band-runner 2>/dev/null || true
          # Deploy band server using limactl copy (avoids pipe issues with --plain)
          limactl shell bands-executor -- mkdir -p $VM_HOME/bands-server
          limactl copy packages/runtime/src/band-server.ts bands-executor:$VM_HOME/bands-server/server.ts
          limactl shell bands-executor -- bash -c "cd $VM_HOME/bands-server && $VM_HOME/.bun/bin/bun add hono"
          # Create systemd user service for the band server
          limactl shell bands-executor -- mkdir -p $VM_HOME/.config/systemd/user
          limactl shell bands-executor -- bash -c "printf '[Unit]\nDescription=Band execution server\n[Service]\nExecStart=$VM_HOME/.bun/bin/bun run $VM_HOME/bands-server/server.ts\nRestart=always\nWorkingDirectory=$VM_HOME/bands-server\n[Install]\nWantedBy=default.target\n' > $VM_HOME/.config/systemd/user/band-server.service"
          limactl shell bands-executor -- systemctl --user daemon-reload
          limactl shell bands-executor -- systemctl --user enable band-server
          limactl shell bands-executor -- systemctl --user start band-server
          limactl shell bands-executor -- loginctl enable-linger $(limactl shell bands-executor -- whoami | tr -d '\n\r')
          # Wait for server to start (poll health endpoint from inside VM)
          for i in $(seq 1 15); do
            if limactl shell bands-executor -- curl -sf --max-time 2 http://localhost:9000/health 2>/dev/null; then
              echo "Server healthy after ${i}s"
              break
            fi
            sleep 1
          done
          # Verify health from inside VM (port forward may not work with --plain/QEMU)
          limactl shell bands-executor -- curl -sf --max-time 5 http://localhost:9000/health || {
            echo "=== Server status ==="
            limactl shell bands-executor -- systemctl --user status band-server 2>&1 || true
            echo "=== Server log ==="
            limactl shell bands-executor -- journalctl --user -u band-server --no-pager -n 30 2>&1 || true
            exit 1
          }
          # Skip default iptables lockdown in CI — the VM is ephemeral and
          # IP-based firewall rules can't reliably match CDN/anycast IPs.
          # Per-execution firewall rules still apply within each band execution.
          echo "Skipping default iptables lockdown (CI environment)"

      - name: Install gh CLI in VM
        run: |
          limactl copy skills/github/setup.sh bands-executor:/tmp/setup.sh
          limactl shell bands-executor -- bash /tmp/setup.sh
          limactl shell bands-executor -- touch /tmp/.band-setup-done-github

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "$TEST_GITHUB_TOKEN" ] && missing="$missing TEST_GITHUB_TOKEN"
          [ -z "$TEST_GITHUB_REPO" ] && missing="$missing TEST_GITHUB_REPO"
          [ -z "$TEST_GIST_GITHUB_TOKEN" ] && missing="$missing TEST_GIST_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          TEST_GITHUB_REPO: ${{ secrets.TEST_GITHUB_REPO }}
          TEST_GIST_GITHUB_TOKEN: ${{ secrets.TEST_GIST_GITHUB_TOKEN }}

      - name: Run banded-skills integration tests
        run: bun test test/integration/banded-skills.test.ts
        working-directory: packages/runtime

      - name: Run direct skill tests
        run: bun scripts/test-skills.ts github elevenlabs --direct
        env:
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          TEST_GITHUB_REPO: ${{ secrets.TEST_GITHUB_REPO }}
          TEST_GIST_GITHUB_TOKEN: ${{ secrets.TEST_GIST_GITHUB_TOKEN }}
          TEST_ELEVEN_LABS_TOKEN: ${{ secrets.TEST_ELEVEN_LABS_TOKEN }}
        timeout-minutes: 10

      - name: Cleanup Lima VM
        if: always()
        run: limactl stop bands-executor --force && limactl delete bands-executor --force || true

  skill-tests-agent:
    name: Skill Tests (Agent)
    runs-on: ubuntu-latest
    needs: skill-tests-direct
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Lima and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v1.0.5/lima-1.0.5-Linux-x86_64.tar.gz | sudo tar xz -C /usr/local

      - name: Create Lima VM
        run: |
          limactl start --name=bands-executor template://ubuntu-lts --vm-type=qemu --cpus=2 --memory=4 --plain
          limactl shell bands-executor -- uname -a
          # Set up SSH port forwarding for band server (--plain mode doesn't auto-forward)
          SSH_CONFIG=~/.lima/bands-executor/ssh.config
          if [ -f "$SSH_CONFIG" ]; then
            ssh -F "$SSH_CONFIG" -fNL 9000:localhost:9000 lima-bands-executor
            echo "Port 9000 forwarded"
          fi

      - name: Set up band server in VM
        run: |
