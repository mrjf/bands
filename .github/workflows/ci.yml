          [ -z "$TEST_GIST_GITHUB_TOKEN" ] && missing="$missing TEST_GIST_GITHUB_TOKEN"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
